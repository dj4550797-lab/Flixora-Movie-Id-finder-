<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flixora Movie ID Finder</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        aiCyan: '#00f2fe',
                        aiBlue: '#4facfe',
                        dark: '#0a0a0a',
                        card: '#121212'
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    animation: {
                        'pulse-fast': 'pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    }
                }
            }
        }
    </script>
    <style>
        /* Hide scrollbars but keep functionality */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Neon Custom Scrollbar */
        .custom-scrollbar::-webkit-scrollbar {
            height: 4px;
            width: 4px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 10px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(0, 242, 254, 0.4);
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.8);
        }

        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 242, 254, 1);
        }

        /* Neon Scroll Container Glow */
        .neon-scroll-container {
            position: relative;
        }

        .neon-scroll-container::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 20px;
            pointer-events: none;
            background: linear-gradient(to top, rgba(0, 242, 254, 0.05), transparent);
            border-bottom: 1px solid rgba(0, 242, 254, 0.2);
            border-radius: 0 0 10px 10px;
        }

        /* Movie Card Neon Ring & Hover */
        .media-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            /* Permanent Neon Ring */
            border: 2px solid rgba(0, 242, 254, 0.3);
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.2);
            border-radius: 0.75rem;
        }

        .media-card:hover {
            transform: translateY(-8px) scale(1.05);
            z-index: 10;
            border-color: rgba(0, 242, 254, 1);
            box-shadow: 0 10px 25px rgba(0, 242, 254, 0.6);
        }

        /* Glass UI */
        .glass-header {
            background: linear-gradient(to bottom, rgba(10, 10, 10, 0.95) 0%, rgba(10, 10, 10, 0) 100%);
            transition: all 0.3s ease;
        }

        .glass-header.scrolled {
            background: rgba(10, 10, 10, 0.85);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(0, 242, 254, 0.1);
        }

        /* AI Loader Spinner */
        .ai-loader {
            border: 3px solid rgba(0, 242, 254, 0.1);
            border-top: 3px solid #00f2fe;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.5);
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        /* Smooth Modal Reveal */
        .modal-reveal {
            animation: reveal 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes reveal {
            0% {
                opacity: 0;
                transform: scale(0.97) translateY(10px);
            }

            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
    </style>
</head>

<body class="bg-dark text-white font-sans overflow-x-hidden selection:bg-aiCyan selection:text-black">

         HEADER & AI SEARCH
         ========================================== -->

    <!-- ==========================================
         JAVASCRIPT LOGIC
         ========================================== -->
    <script>
        const API_KEY = 'ef3c9e207a5c0800c9f5d1b9f13da277';
        const TMDB_BASE = 'https://api.themoviedb.org/3';
        const IMG_BASE = 'https://image.tmdb.org/t/p/w500';
        const IMG_ORG = 'https://image.tmdb.org/t/p/original';

        let currentImdbId = '';

        const formatCurrency = (num) => num > 0 ? new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 }).format(num) : 'N/A';
        const formatRuntime = (mins) => mins ? `${Math.floor(mins / 60)}h ${mins % 60}m` : 'N/A';

        document.addEventListener('DOMContentLoaded', () => {
            fetchDashboardData();

            window.addEventListener('scroll', () => {
                const header = document.getElementById('mainHeader');
                if (window.scrollY > 20) header.classList.add('scrolled');
                else header.classList.remove('scrolled');
            });
        });

        async function fetchAPI(endpoint) {
            try {
                const sep = endpoint.includes('?') ? '&' : '?';
                const url = `${TMDB_BASE}${endpoint}${sep}api_key=${API_KEY}`;
                const res = await fetch(url);
                return await res.json();
            } catch (err) {
                console.error('Fetch Error:', err);
                return null;
            }
        }

        async function fetchDashboardData() {
            // Trending
            const trending = await fetchAPI('/trending/all/day');
            if (trending && trending.results) {
                renderRow('trendingList', trending.results);
                renderHero(trending.results[0]);
            }
            // Upcoming
            const upcoming = await fetchAPI('/movie/upcoming');
            if (upcoming && upcoming.results) renderRow('upcomingList', upcoming.results, 'movie');

            // Movies
            const movies = await fetchAPI('/movie/popular');
            if (movies && movies.results) renderRow('moviesList', movies.results, 'movie');

            // Web Series
            const tv = await fetchAPI('/tv/popular');
            if (tv && tv.results) renderRow('tvList', tv.results, 'tv');

            // Anime (Genres 16 = Animation, Original Lang = JA)
            const anime = await fetchAPI('/discover/tv?with_genres=16&with_original_language=ja&sort_by=popularity.desc');
            if (anime && anime.results) renderRow('animeList', anime.results, 'tv');
        }

        function renderRow(containerId, items, forceType = null) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';

            items.forEach(item => {
                if (!item.poster_path) return;
                const type = forceType || item.media_type || (item.first_air_date ? 'tv' : 'movie');

                const img = document.createElement('img');
                img.src = `${IMG_BASE}${item.poster_path}`;
                img.className = 'w-[130px] sm:w-[160px] h-[195px] sm:h-[240px] object-cover media-card bg-zinc-900';
                img.loading = 'lazy';
                img.onclick = () => openDetails(item.id, type);
                container.appendChild(img);
            });
        }

        function renderHero(item) {
            const type = item.media_type || (item.first_air_date ? 'tv' : 'movie');
            document.getElementById('heroSection').style.backgroundImage = `url(${IMG_ORG}${item.backdrop_path || item.poster_path})`;
            document.getElementById('heroTitle').innerText = item.title || item.name;
            document.getElementById('heroOverview').innerText = item.overview;

            document.getElementById('heroButtons').innerHTML = `
                <button onclick="openDetails(${item.id}, '${type}')" class="bg-gradient-to-r from-aiCyan to-aiBlue text-black font-black px-8 py-3.5 rounded-full shadow-[0_0_15px_rgba(0,242,254,0.4)] hover:shadow-[0_0_25px_rgba(0,242,254,0.8)] transition transform hover:scale-105 flex items-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg> 
                    VIEW AI INSIGHTS
                </button>
            `;
        }

        // -----------------------
        // INFO MODAL
        // -----------------------
        async function openDetails(id, type) {
            const modal = document.getElementById('detailsModal');
            const loader = document.getElementById('modalLoader');
            const content = document.getElementById('modalContent');

            modal.classList.remove('hidden');
            loader.classList.remove('hidden');
            content.classList.add('hidden');
            content.classList.remove('opacity-100');
            document.body.style.overflow = 'hidden';

            document.getElementById('modalTrailerFrame').src = '';

            const data = await fetchAPI(`/${type}/${id}?append_to_response=credits,videos,external_ids`);
            if (!data) { closeModal(); return; }

            const title = data.title || data.name;
            const year = (data.release_date || data.first_air_date || 'N/A').split('-')[0];

            document.getElementById('modalBackdrop').style.backgroundImage = `url(${IMG_ORG}${data.backdrop_path || data.poster_path})`;
            document.getElementById('modalPoster').src = `${IMG_BASE}${data.poster_path}`;

            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalTagline').innerText = data.tagline ? `"${data.tagline}"` : '';
            document.getElementById('modalOverview').innerText = data.overview || "No overview available.";
            document.getElementById('modalTmdbId').innerText = `#${data.id}`;
            document.getElementById('modalStatus').innerText = data.status || 'N/A';
            document.getElementById('modalLanguage').innerText = data.original_language || 'N/A';

            // Production Company / Network
            const prodEl = document.getElementById('modalProduction');
            if (type === 'tv' && data.networks && data.networks.length > 0) {
                prodEl.innerText = data.networks[0].name;
                prodEl.title = data.networks[0].name;
            } else if (data.production_companies && data.production_companies.length > 0) {
                prodEl.innerText = data.production_companies[0].name;
                prodEl.title = data.production_companies[0].name;
            } else {
                prodEl.innerText = 'Unknown';
            }

            document.getElementById('modalRating').innerText = data.vote_average ? data.vote_average.toFixed(1) : 'NR';
            document.getElementById('modalYear').innerText = year;
            document.getElementById('modalType').innerText = type === 'movie' ? 'Movie' : 'Series';
            document.getElementById('modalRuntime').innerText = type === 'movie' ? formatRuntime(data.runtime) : (data.episode_run_time?.[0] ? `${data.episode_run_time[0]}m / ep` : 'N/A');

            document.getElementById('modalGenres').innerHTML = data.genres ? data.genres.map(g => `<span class="text-xs bg-zinc-800 text-zinc-300 border border-zinc-700 px-2.5 py-1 rounded-full">${g.name}</span>`).join('') : '';

            const finBox = document.getElementById('financeBox');
            const tvBox = document.getElementById('tvBox');
            if (type === 'movie') {
                finBox.classList.remove('hidden');
                tvBox.classList.add('hidden');
                document.getElementById('modalBudget').innerText = formatCurrency(data.budget);
                document.getElementById('modalRevenue').innerText = formatCurrency(data.revenue);
            } else {
                finBox.classList.add('hidden');
                tvBox.classList.remove('hidden');
                document.getElementById('modalSeasons').innerText = data.number_of_seasons || 'N/A';
                document.getElementById('modalEpisodes').innerText = data.number_of_episodes || 'N/A';
            }

            // Copy ID Button logic
            const imdbBtn = document.getElementById('modalImdbBtn');
            currentImdbId = data.external_ids?.imdb_id || '';
            if (currentImdbId) {
                document.getElementById('modalImdbIdText').innerText = `Copy ID: ${currentImdbId}`;
                imdbBtn.classList.remove('hidden');
            } else {
                imdbBtn.classList.add('hidden');
            }

            // Trailer Fix (Uses standard YouTube embed to prevent Error 153 on mobile)
            const trailerContainer = document.getElementById('trailerSection');
            const videos = data.videos?.results || [];
            const trailer = videos.find(v => v.site === 'YouTube' && v.type === 'Trailer') || videos.find(v => v.site === 'YouTube');
            if (trailer) {
                trailerContainer.classList.remove('hidden');
                // Removed nocookie and extra params to fix mobile error 153
                document.getElementById('modalTrailerFrame').src = `https://www.youtube.com/embed/${trailer.key}`;
            } else {
                trailerContainer.classList.add('hidden');
            }

            if (data.credits) {
                const dirEl = document.getElementById('modalDirector');
                const director = data.credits.crew?.find(c => c.job === 'Director' || c.job === 'Executive Producer');
                if (director) {
                    dirEl.innerHTML = `Dir: <span class="text-white">${director.name}</span>`;
                    dirEl.classList.remove('hidden');
                } else {
                    dirEl.classList.add('hidden');
                }

                document.getElementById('modalCast').innerHTML = data.credits.cast.slice(0, 15).map(c => `
                    <div class="flex-shrink-0 w-[100px] bg-zinc-900 border border-zinc-800 rounded-lg overflow-hidden group">
                        <img src="${c.profile_path ? IMG_BASE + c.profile_path : 'https://via.placeholder.com/200x300/111/444?text=No+Img'}" class="w-full h-[140px] object-cover filter brightness-90 group-hover:brightness-110 transition">
                        <div class="p-2 text-center">
                            <p class="text-[11px] text-white font-bold leading-tight truncate" title="${c.name}">${c.name}</p>
                            <p class="text-[9px] text-aiCyan truncate mt-0.5" title="${c.character}">${c.character}</p>
                        </div>
                    </div>
                `).join('');
            }

            loader.classList.add('hidden');
            content.classList.remove('hidden');
            setTimeout(() => content.classList.add('opacity-100'), 50);
        }

        function copyImdbId() {
            if (currentImdbId) {
                navigator.clipboard.writeText(currentImdbId);
                const txt = document.getElementById('modalImdbIdText');
                txt.innerText = 'COPIED!';
                setTimeout(() => {
                    txt.innerText = `Copy ID: ${currentImdbId}`;
                }, 2000);
            }
        }

        function closeModal() {
            document.getElementById('detailsModal').classList.add('hidden');
            document.body.style.overflow = '';
            document.getElementById('modalTrailerFrame').src = '';
        }

        // -----------------------
        // AI SEARCH
        // -----------------------
        let searchTimeout;
        const searchInput = document.getElementById('searchInput');
        const searchThinking = document.getElementById('searchThinking');

        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.trim();
            clearTimeout(searchTimeout);

            if (!query) {
                searchThinking.classList.add('hidden');
                showHome();
                return;
            }

            searchThinking.classList.remove('hidden');

            searchTimeout = setTimeout(async () => {
                const data = await fetchAPI(`/search/multi?query=${encodeURIComponent(query)}`);
                searchThinking.classList.add('hidden');

                if (data && data.results) {
                    const filtered = data.results.filter(i => i.media_type === 'movie' || i.media_type === 'tv');
                    document.getElementById('homeView').classList.add('hidden');
                    document.getElementById('searchView').classList.remove('hidden');
                    renderRow('searchGrid', filtered);
                    window.scrollTo(0, 0);
                }
            }, 600);
        });

        function showHome() {
            searchInput.value = '';
            searchThinking.classList.add('hidden');
            document.getElementById('searchView').classList.add('hidden');
            document.getElementById('homeView').classList.remove('hidden');
        }
    </script>
</body>

</html>
